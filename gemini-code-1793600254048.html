<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>나의 시작 페이지</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f4f5f9;--card:#fff;--text:#1c2033;--sub:#6b7190;--line:#e4e6ef;--accent:#4f6bff;--up:#e5384a;--down:#2f6bff}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#0f1220;--card:#181c30;--text:#eceefa;--sub:#9aa0c0;--line:#272c47;--accent:#7b90ff;--up:#ff6b7a;--down:#6f9bff}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#0f1220;--card:#181c30;--text:#eceefa;--sub:#9aa0c0;--line:#272c47;--accent:#7b90ff;--up:#ff6b7a;--down:#6f9bff}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:"Pretendard","Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif}
.wrap{max-width:1100px;margin:0 auto;padding:24px 16px 48px}
header{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:12px}
#clock{font-size:clamp(34px,7vw,56px);font-weight:700;letter-spacing:-1px;line-height:1}
#date{color:var(--sub);margin-top:6px}
#greet{color:var(--sub);text-align:right}
.theme-toggle{background:var(--card);border:1px solid var(--line);color:var(--text);border-radius:999px;padding:6px 12px;font-size:13px;cursor:pointer;display:inline-flex;align-items:center;gap:4px}
.theme-toggle:hover{border-color:var(--accent)}
.search{display:flex;gap:8px;margin:20px 0}
.search select,.search input,.search button{font:inherit;color:var(--text);background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.search input{flex:1;min-width:0}
.search button{background:var(--accent);color:#fff;border-color:var(--accent);cursor:pointer}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:10px}
.card h2{margin:0;font-size:16px;display:flex;justify-content:space-between;align-items:center}
.card h2 small{font-weight:400;color:var(--sub);font-size:12px}
.snap{min-height:64px;font-size:14px;line-height:1.55}
.snap .empty{color:var(--sub);font-size:13px}
.snap li{margin:4px 0}
.up{color:var(--up)}.down{color:var(--down)}
ul{margin:0;padding-left:18px}
.links{display:flex;flex-wrap:wrap;gap:6px;margin-top:auto}
.links a{font-size:13px;text-decoration:none;color:var(--accent);border:1px solid var(--line);border-radius:999px;padding:6px 11px}
.links a:hover{border-color:var(--accent)}
.fav{margin-top:14px}
.fav .row{display:flex;gap:8px;flex-wrap:wrap}
.fav input{font:inherit;color:var(--text);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px 10px;min-width:0;flex:1 1 120px}
.fav button{font:inherit;border:1px solid var(--line);background:var(--bg);color:var(--text);border-radius:10px;padding:8px 12px;cursor:pointer}
.chip{display:inline-flex;gap:6px;align-items:center;background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:6px 8px 6px 12px;font-size:13px}
.chip a{color:var(--text);text-decoration:none}.chip b{cursor:pointer;color:var(--sub);font-weight:400}
#favs{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.foot{margin-top:18px;color:var(--sub);font-size:12px;text-align:center}
</style>
</head>
<body>
<div class="wrap">
<header>
  <div>
    <div id="clock">--:--</div>
    <div id="date"></div>
  </div>
  <div style="display:flex;flex-direction:column;align-items:flex-end;gap:8px">
    <button id="theme-btn" class="theme-toggle">🌙 다크 모드</button>
    <div id="greet"></div>
  </div>
</header>

<div class="search">
  <select id="eng">
    <option value="https://search.naver.com/search.naver?query=">네이버</option>
    <option value="https://www.google.com/search?q=">구글</option>
    <option value="https://www.youtube.com/results?search_query=">유튜브</option>
  </select>
  <input id="q" placeholder="검색어를 입력하세요" autocomplete="off">
  <button id="go">검색</button>
</div>

<div class="grid">
  <section class="card">
    <h2>📈 한국 증시 <small>KOSPI · KOSDAQ</small></h2>
    <div class="snap" id="s-market"></div>
    <div class="links">
      <a target="_blank" rel="noopener" href="https://finance.naver.com/sise/">네이버 증권</a>
      <a target="_blank" rel="noopener" href="https://data.krx.co.kr">KRX</a>
      <a target="_blank" rel="noopener" href="https://finance.naver.com/marketindex/">환율</a>
    </div>
  </section>

  <section class="card">
    <h2>🎬 연예 뉴스 <small>Entertainment</small></h2>
    <div class="snap" id="s-ent"></div>
    <div class="links">
      <a target="_blank" rel="noopener" href="https://entertain.naver.com">네이버 연예</a>
      <a target="_blank" rel="noopener" href="https://entertain.daum.net">다음 연예</a>
      <a target="_blank" rel="noopener" href="https://www.starnewskorea.com">스타뉴스</a>
    </div>
  </section>

  <section class="card">
    <h2>🎮 LoL e스포츠 <small>LCK · Worlds</small></h2>
    <div class="snap" id="s-lol"></div>
    <div class="links">
      <a target="_blank" rel="noopener" href="https://lolesports.com">LoL Esports</a>
      <a target="_blank" rel="noopener" href="https://www.inven.co.kr/webzine/news/?site=lol">인벤 LoL</a>
      <a target="_blank" rel="noopener" href="https://www.fmkorea.com/lol">에펨코리아</a>
      <a target="_blank" rel="noopener" href="https://lol.fandom.com/wiki/LCK">Leaguepedia</a>
    </div>
  </section>
</div>

<section class="card fav">
  <h2>⭐ 내 즐겨찾기 <small>이 브라우저에만 저장돼요</small></h2>
  <div class="row">
    <input id="fn" placeholder="이름">
    <input id="fu" placeholder="https://주소">
    <button id="fa">추가</button>
  </div>
  <div id="favs"></div>
</section>

<div class="foot" id="foot"></div>
</div>

<script>
let DATA = {
  asOf: "2026.11.02(월) 정오 무렵 (증시는 장중 수치)",
  market: [
    {name:"코스피(장중)", value:"5,813.78", chg:"+1.45%"},
    {name:"코스닥(장중)", value:"729.88", chg:"+0.76%"},
    {name:"원·달러(개장 직후)", value:"1,333.60원", chg:""}
  ],
  ent: ["오늘자 연예 헤드라인은 검색에서 확인하지 못했어요. 아래 링크에서 바로 확인해 주세요."],
  lol: [
    "2026 롤드컵 진행 중: LCK 젠지·한화생명e스포츠·T1·디플러스 기아 4팀 출전",
    "스위스 스테이지 2라운드에서 LCK 팀끼리 맞붙어 젠지·DK는 웃고 한화생명·T1은 아쉬운 결과",
    "결승전은 11월 14일(현지) 미국 뉴욕 바클레이스 센터에서 열려요",
    "LCK 한국어 생중계는 치지직·SOOP, 롤드컵은 유튜브에서도 시청 가능"
  ]
};

const $=id=>document.getElementById(id);
const EMPTY='<div class="empty">오늘 브리핑을 불러오지 못했어요. 아래 링크로 바로 확인해 보세요.</div>';

function tick(){
  const d=new Date(),p=n=>String(n).padStart(2,'0');
  $('clock').textContent=p(d.getHours())+':'+p(d.getMinutes());
  $('date').textContent=d.toLocaleDateString('ko-KR',{year:'numeric',month:'long',day:'numeric',weekday:'long'});
  const h=d.getHours();
  $('greet').textContent=h<6?'늦은 밤이에요 🌙':h<12?'좋은 아침이에요 ☀️':h<18?'좋은 오후예요 🙂':'좋은 저녁이에요 🌆';
}
tick();setInterval(tick,15000);

function esc(s){const e=document.createElement('div');e.textContent=s;return e.innerHTML}
function list(a){return a&&a.length?'<ul>'+a.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul>':EMPTY}

function render(){
  $('s-market').innerHTML=DATA.market.length?DATA.market.map(m=>'<div style="display:flex;justify-content:space-between"><span>'+esc(m.name)+'</span><span><b>'+esc(m.value)+'</b> <span class="'+(m.chg.trim().startsWith('-')?'down':'up')+'">'+esc(m.chg)+'</span></span></div>').join(''):EMPTY;
  $('s-ent').innerHTML=list(DATA.ent);
  $('s-lol').innerHTML=list(DATA.lol);
  $('foot').textContent=DATA.asOf?'브리핑 기준: '+DATA.asOf:'';
}
render();
fetch('data.json?'+Date.now()).then(r=>r.json()).then(d=>{DATA=d;render()}).catch(()=>{});

function search(){const q=$('q').value.trim();if(q)window.open($('eng').value+encodeURIComponent(q),'_blank','noopener')}
$('go').onclick=search;$('q').addEventListener('keydown',e=>{if(e.key==='Enter')search()});

// 테마 토글 로직
const themeBtn = $('theme-btn');
const savedTheme = localStorage.getItem('theme');
const systemPrefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
let currentTheme = savedTheme || (systemPrefersDark ? 'dark' : 'light');

function applyTheme(theme) {
  document.documentElement.setAttribute('data-theme', theme);
  localStorage.setItem('theme', theme);
  themeBtn.textContent = theme === 'dark' ? '☀️ 라이트 모드' : '🌙 다크 모드';
}
applyTheme(currentTheme);

themeBtn.onclick = () => {
  const nextTheme = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
  applyTheme(nextTheme);
};

// 즐겨찾기 로직
let favs=[];
try{favs=JSON.parse(localStorage.getItem('favs')||'[]')}catch(e){favs=[]}
function save(){try{localStorage.setItem('favs',JSON.stringify(favs))}catch(e){}}
function renderFavs(){
  const box=$('favs');box.textContent='';
  favs.forEach((f,i)=>{
    const c=document.createElement('span');c.className='chip';
    const a=document.createElement('a');a.href=f.u;a.target='_blank';a.rel='noopener';a.textContent=f.n;
    const x=document.createElement('b');x.textContent='✕';x.onclick=()=>{favs.splice(i,1);save();renderFavs()};
    c.append(a,x);box.append(c);
  });
}
$('fa').onclick=()=>{
  let n=$('fn').value.trim(),u=$('fu').value.trim();
  if(!u)return;if(!/^https?:\/\//i.test(u))u='https://'+u;
  try{new URL(u)}catch(e){return}
  favs.push({n:n||u,u});save();renderFavs();$('fn').value='';$('fu').value='';
};
renderFavs();
</script>
</body>
</html>
